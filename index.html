<div class="sf-round-btn" id="sfRoundBtn" onclick="triggerBulkAction()" onmousedown="pauseSfTimer()" onmouseup="resumeSfTimer()" ontouchstart="pauseSfTimer()" ontouchend="resumeSfTimer()" title="এক ক্লিকে সব বোর্ড"></div>
</div>
<div class="chat-area">
<div class="chat-messages" id="chatMessages"></div>
</div>
<div class="room-bottom">
<button class="chat-btn" onclick="openMsgPopup()">💬</button>
<button class="seat-emoji-btn" id="seatEmojiBtn" onclick="openEmojiPopup()">😊</button>
<button class="action-btn mic-btn" id="seatMicBtn" onclick="toggleSeatMic()">🎤</button>
<button class="action-btn gift-btn" onclick="openGiftPopup()">🎁</button>
<button class="action-btn game-btn" onclick="openGame()">🎮</button>
</div>
<div class="msg-popup-overlay" id="msgPopup">
<div class="msg-popup">
<div class="msg-popup-title">মেসেজ লিখুন</div>
<input type="text" class="msg-popup-input" id="popupInput" placeholder="এখানে টেক্সট লিখুন..." maxlength="100">
<div class="msg-popup-btns">
<button class="msg-cancel" onclick="closeMsgPopup()">বাতিল</button>
<button class="msg-send" onclick="sendFromPopup()">পাঠান</button>
</div>
</div>
</div>
<div class="emoji-popup-overlay" id="emojiPopup">
<div class="emoji-popup">
<div class="emoji-popup-title">ইমোজি সিলেক্ট করুন</div>
<div class="emoji-grid" id="emojiGrid"></div>
<button class="emoji-close" onclick="closeEmojiPopup()">বন্ধ করুন</button>
</div>
</div>
<div class="gift-popup-overlay" id="giftPopup">
<div class="gift-popup">
<div class="gift-popup-title">গিফট সিলেক্ট করুন</div>
<div class="gift-tabs" id="giftTabs">
<div class="gift-tab active" data-category="lucky">Lucky</div>
<div class="gift-tab" data-category="cp">CP</div>
<div class="gift-tab" data-category="country">Country</div>
<div class="gift-tab" data-category="magic">Magic</div>
</div>
<div class="gift-grid" id="giftGrid"></div>
<button class="gift-close" onclick="closeGiftPopup()">বন্ধ করুন</button>
</div>
</div>
</div>
<div id="gameOverlay">
<button class="game-close-btn" onclick="closeGame()" title="গেম বন্ধ করুন">✕</button>
<iframe id="gameFrame" allow="autoplay"></iframe>
</div>
<div class="toast" id="toast"></div>
</div>
<script>
// ==========================================
// FIREBASE CONFIGURATION
// ==========================================
const firebaseConfig = {
    apiKey: "AIzaSyDzhyiPYzfHePRl9uyaK_-gZ0oHu5xzEmk",
    authDomain: "voice-room-b0bc4.firebaseapp.com",
    databaseURL: "https://voice-room-b0bc4-default-rtdb.firebaseio.com",
    projectId: "voice-room-b0bc4",
    storageBucket: "voice-room-b0bc4.firebasestorage.app",
    messagingSenderId: "214182228339",
    appId: "1:214182228339:web:084fb6faa1095de4e05506"
};

// Initialize Firebase
if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
    firebase.initializeApp(firebaseConfig);
}
const db = firebase.apps.length ? firebase.database() : null;

const rooms=[{id:1,name:"👑 Rao/King/Agency 👑",desc:"🇵🇰 PK · Most welcome /Everyone 👋",img:33,country:"pk",viewers:142},{id:2,name:"🎂 HaPpY 1st mOnThsary",desc:"🇵🇭 PH · ResPect,...",img:25,country:"ph",viewers:89},{id:3,name:"ভালোবাসার গল্প",desc:"🇧🇩 BD · এখানে এজেন্টী এবং হোস্ট দেওয়া হয় ❤",img:45,country:"bd",viewers:210},{id:4,name:"🌹 SONIYA BD/AGENCY ROOMS 🌹",desc:"🇮🇳 IN · There are a lot of very interested friends ...",img:60,country:"bd",viewers:156},{id:5,name:"🔥 Hot Momma's Agency 🔥",desc:"🇵🇭 PH · Choose your company wisely!",img:32,country:"ph",viewers:98},{id:6,name:"🍀 Mrs Happy 🍀",desc:"🇵🇰 PK · There are a lot of very interested friends ...",img:47,country:"pk",viewers:67},{id:7,name:"💕 Ms.Lovely Room 💕",desc:"🇵🇭 PH · Always Hope But never expect ❌",img:26,country:"ph",viewers:134},{id:8,name:"ZEBBY AGENCY",desc:"🇵🇭 PH · Welcome",img:15,country:"ph",viewers:45},{id:9,name:"💕 ته كينه زه رازم 💕",desc:"🇦🇪 AE · DON'T CHASE ME...",img:11,country:"pk",viewers:78},{id:10,name:"🦁 ROYAL KING AGENCY",desc:"🇧🇩 BD · কয়েন রিচার্জ হোস্টিং ও এজেন্সি দেওয়া হয়",img:68,country:"bd",viewers:189}];
const names=["Rina","Sakib","Nusrat","Rahim","Mim","Karim","Faria","Imran","Sonia","Joy","Lima","Arif","Tania","Hasan","Ruma","Babu","Nila","Shuvo","Popy","Rafi"];
const avatars=[1,3,5,7,9,11,12,14,16,20,23,25,28,32,33,36,41,45,47,49,52,55,60,62,65,68];
const giftCategories={lucky:["🥭","🐅","🦣","🦜","🐠","🕊️","🧊","🚀","🎈","👑"],cp:["💑","💍","💌","🌹","💋","💖","🧸","🎀","🕊","💞"],country:["🇧🇩","🇵🇰","🇵🇭","🇮🇳","🇦🇪","🇸🇦","🇺🇸","🇬🇧","🇹🇷","🇯🇵"],magic:["✨","🔮","🪄","🦄","🐉","⚡","🍄","🌀","🦋","🌌"]};
const emojiList=["😀","😂","😍","😎","🥳","😭","😡","👍","❤","🔥","✨","🎉","👏","🙏","🌹"];

let currentCategory="lucky";
let selectedGift="🥭";
let seatsData=[];
let mySeat=-1;
let currentRoom=null;
let seatMicMuted=false;
let sfButtonTimer=null;
let sfTimeRemaining=5000;
let sfTimerStartTime=null;
let sfIsPaused=false;
const myUserId = "User_" + Math.floor(Math.random() * 9000 + 1000);

function init(){
    renderRoomList("all");
    renderGiftGrid();
    renderEmojiGrid();
    
    document.getElementById("tabs").addEventListener("click",e=>{
        if(e.target.classList.contains("tab")){
            document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
            e.target.classList.add("active");
            renderRoomList(e.target.dataset.tab);
        }
    });
    
    document.getElementById("giftTabs").addEventListener("click",e=>{
        if(e.target.classList.contains("gift-tab")){
            document.querySelectorAll(".gift-tab").forEach(t=>t.classList.remove("active"));
            e.target.classList.add("active");
            currentCategory=e.target.dataset.category;
            renderGiftGrid();
        }
    });
    
    document.getElementById("popupInput").addEventListener("keypress",e=>{
        if(e.key==="Enter")sendFromPopup();
    });
}

function renderRoomList(filter){
    const list=document.getElementById("roomList");
    list.innerHTML="";
    const filtered=filter==="all"?rooms:filter==="hot"?rooms.filter(r=>r.viewers>100):rooms.filter(r=>r.country===filter);
    filtered.forEach(r=>{
        const div=document.createElement("div");
        div.className="room-card";
        div.onclick=()=>enterRoom(r);
        div.innerHTML=`<img class="room-thumb" src="https://i.pravatar.cc/120?img=${r.img}" alt=""><div class="room-info"><div class="room-name">${r.name}</div><div class="room-desc">${r.desc}</div><div class="room-meta">👥 ${r.viewers} online</div></div><div class="room-gift">🧧</div>`;
        list.appendChild(div);
    });
}

function renderGiftGrid(){
    const grid=document.getElementById("giftGrid");
    grid.innerHTML="";
    const currentList=giftCategories[currentCategory]||giftCategories.lucky;
    currentList.forEach(g=>{
        const div=document.createElement("div");
        div.className="gift-item"+(g===selectedGift?" selected":"");
        div.textContent=g;
        div.onclick=()=>selectGift(g);
        grid.appendChild(div);
    });
}

function renderEmojiGrid(){
    const grid=document.getElementById("emojiGrid");
    grid.innerHTML="";
    emojiList.forEach(emoji=>{
        const div=document.createElement("div");
        div.className="emoji-item";
        div.textContent=emoji;
        div.onclick=()=>sendEmoji(emoji);
        grid.appendChild(div);
    });
}

function sendEmoji(emoji){
    sendChatMessage("আমি", emoji);
    closeEmojiPopup();
    showToast(`${emoji} পাঠানো হয়েছে`);
}

function selectGift(g){
    selectedGift=g;
    renderGiftGrid();
    showToast(`${g} সিলেক্ট করা হয়েছে`);
    closeGiftPopup();
    showSpecialButton();
}

function showSpecialButton(){
    const btn=document.getElementById("sfRoundBtn");
    btn.classList.add("show");
    if(sfButtonTimer){clearTimeout(sfButtonTimer);}
    sfTimeRemaining=5000;
    sfIsPaused=false;
    sfTimerStartTime=Date.now();
    sfButtonTimer=setTimeout(()=>{btn.classList.remove("show");},sfTimeRemaining);
}

function pauseSfTimer(){
    const btn=document.getElementById("sfRoundBtn");
    if(!btn.classList.contains("show"))return;
    if(!sfIsPaused){
        sfIsPaused=true;
        if(sfButtonTimer){clearTimeout(sfButtonTimer);sfButtonTimer=null;}
        const elapsed=Date.now()-sfTimerStartTime;
        sfTimeRemaining=Math.max(0,sfTimeRemaining-elapsed);
    }
}

function resumeSfTimer(){
    const btn=document.getElementById("sfRoundBtn");
    if(!btn.classList.contains("show"))return;
    if(sfIsPaused){
        sfIsPaused=false;
        sfTimerStartTime=Date.now();
        if(sfButtonTimer){clearTimeout(sfButtonTimer);}
        sfButtonTimer=setTimeout(()=>{btn.classList.remove("show");},sfTimeRemaining);
    }
}

function initSeatsData(){
    let initialSeats = [];
    for(let i=0;i<42;i++){
        initialSeats.push({occupied:false, name:"", avatar:0, userId:""});
    }
    return initialSeats;
}

function renderSeats(){
    const grid=document.getElementById("seatsGrid");
    grid.innerHTML="";
    seatsData.forEach((s,i)=>{
        const div=document.createElement("div");
        let isMe = (s.userId === myUserId);
        div.className="seat"+(s.occupied?" occupied":"")+(isMe?" me":"");
        div.onclick=()=>handleSeatClick(i);
        let html=`<div class="seat-avatar-wrap">`;
        if(s.occupied){
            html+=`<img src="https://i.pravatar.cc/80?img=${s.avatar}" alt="">`;
        }else{
            html+=`<div class="seat-number">${i+1}</div>`;
        }
        html+=`</div>`;
        if(s.occupied){
            html+=`<div class="seat-name">${isMe?"আমি":s.name}</div>`;
        }
        div.innerHTML=html;
        grid.appendChild(div);
    });
    updateOnlineCount();
    updateSeatControlsVisibility();
}

function updateSeatControlsVisibility(){
    const micBtn=document.getElementById("seatMicBtn");
    const seatEmojiBtn=document.getElementById("seatEmojiBtn");
    if(mySeat!==-1){
        micBtn.style.display="flex";
        seatEmojiBtn.style.display="flex";
        updateSeatMicStateUI();
    }else{
        micBtn.style.display="none";
        seatEmojiBtn.style.display="none";
    }
}

function updateSeatMicStateUI(){
    const micBtn=document.getElementById("seatMicBtn");
    if(seatMicMuted){
        micBtn.className="action-btn mic-btn muted-mic";
        micBtn.innerHTML="🔇";
    }else{
        micBtn.className="action-btn mic-btn active-mic";
        micBtn.innerHTML="🎤";
    }
}

function toggleSeatMic(){
    if(mySeat===-1)return;
    seatMicMuted=!seatMicMuted;
    updateSeatMicStateUI();
    showToast(seatMicMuted?"মাইক্রোফোন মিউট করা হয়েছে":"মাইক্রোফোন আনমিউট করা হয়েছে");
}

function handleSeatClick(index){
    if(!currentRoom) return;
    
    if(db){
        const seatRef = db.ref(`rooms/${currentRoom.id}/seats/${index}`);
        if(seatsData[index].userId === myUserId){
            seatRef.set({occupied:false, name:"", avatar:0, userId:""});
            mySeat = -1;
            seatMicMuted = false;
            addSystemMsg("আপনি সিট ছেড়ে দিয়েছেন");
            showToast("সিট ছাড়া হয়েছে");
        }else if(!seatsData[index].occupied){
            if(mySeat !== -1){
                db.ref(`rooms/${currentRoom.id}/seats/${mySeat}`).set({occupied:false, name:"", avatar:0, userId:""});
            }
            let newName = "User_" + Math.floor(Math.random()*900+100);
            let newAvatar = avatars[Math.floor(Math.random()*avatars.length)];
            seatRef.set({occupied:true, name:newName, avatar:newAvatar, userId:myUserId});
            mySeat = index;
            seatMicMuted = false;
            addSystemMsg(`আপনি সিট ${index+1} এ বসেছেন`);
            showToast(`সিট ${index+1} নেওয়া হয়েছে`);
        }else{
            showToast(seatsData[index].name + " এর সিট");
        }
    } else {
        if(seatsData[index].userId === myUserId){
            seatsData[index] = {occupied:false, name:"", avatar:0, userId:""};
            mySeat = -1;
            renderSeats();
            showToast("সিট ছাড়া হয়েছে");
        } else if(!seatsData[index].occupied){
            if(mySeat !== -1){
                seatsData[mySeat] = {occupied:false, name:"", avatar:0, userId:""};
            }
            seatsData[index] = {occupied:true, name:"আমি", avatar:1, userId:myUserId};
            mySeat = index;
            renderSeats();
            showToast(`সিট ${index+1} নেওয়া হয়েছে`);
        }
    }
}

function updateOnlineCount(){
    const count = seatsData.filter(s=>s.occupied).length;
    document.getElementById("onlineCount").textContent=`👥 ${count}`;
}

function enterRoom(room){
    currentRoom=room;
    mySeat=-1;
    seatMicMuted=false;
    document.getElementById("roomTitle").textContent=room.name;
    document.getElementById("listPage").classList.add("hidden");
    document.getElementById("roomPage").classList.add("active");
    
    seatsData = initSeatsData();

    if(db){
        const roomRef = db.ref(`rooms/${room.id}`);
        roomRef.child("seats").on("value", (snapshot)=>{
            if(snapshot.exists()){
                seatsData = snapshot.val();
                mySeat = -1;
                seatsData.forEach((s, idx)=>{
                    if(s && s.userId === myUserId){
                        mySeat = idx;
                    }
                });
            }else{
                roomRef.child("seats").set(seatsData);
            }
            renderSeats();
        });
        
        clearChat();
        addSystemMsg(`"${room.name}" রুমে স্বাগতম!`);
        
        roomRef.child("chats").limitToLast(20).on("child_added", (snapshot)=>{
            const msg = snapshot.val();
            if(msg){
                appendChatUI(msg.user, msg.text);
            }
        });
    } else {
        renderSeats();
        clearChat();
        addSystemMsg(`"${room.name}" রুমে স্বাগতম! (Firebase কনফিগার করুন)`);
    }
}

function leaveRoom(){
    if(db && currentRoom && mySeat !== -1){
        db.ref(`rooms/${currentRoom.id}/seats/${mySeat}`).set({occupied:false, name:"", avatar:0, userId:""});
    }
    if(db && currentRoom){
        db.ref(`rooms/${currentRoom.id}/seats`).off();
        db.ref(`rooms/${currentRoom.id}/chats`).off();
    }
    document.getElementById("listPage").classList.remove("hidden");
    document.getElementById("roomPage").classList.remove("active");
    currentRoom=null;
    mySeat=-1;
    seatMicMuted=false;
    closeMsgPopup();
    closeEmojiPopup();
    closeGiftPopup();
    closeGame();
}

function clearChat(){
    document.getElementById("chatMessages").innerHTML="";
}

function sendChatMessage(user, text){
    if(!currentRoom) return;
    if(db){
        const chatRef = db.ref(`rooms/${currentRoom.id}/chats`).push();
        chatRef.set({user: user, text: text, timestamp: Date.now()});
    } else {
        appendChatUI(user, text);
    }
}

function appendChatUI(user, text){
    const box=document.getElementById("chatMessages");
    const div=document.createElement("div");
    div.className="chat-msg";
    div.innerHTML=`<span class="user">${user}:</span> ${text}`;
    box.appendChild(div);
    box.scrollTop=box.scrollHeight;
}

function addSystemMsg(text){
    const box=document.getElementById("chatMessages");
    const div=document.createElement("div");
    div.className="chat-msg system";
    div.textContent=text;
    box.appendChild(div);
    box.scrollTop=box.scrollHeight;
}

function openMsgPopup(){
    document.getElementById("msgPopup").classList.add("show");
    document.getElementById("popupInput").value="";
    setTimeout(()=>document.getElementById("popupInput").focus(),100);
}
function closeMsgPopup(){
    document.getElementById("msgPopup").classList.remove("show");
}
function sendFromPopup(){
    const input=document.getElementById("popupInput");
    const text=input.value.trim();
    if(!text)return;
    sendChatMessage("আমি", text);
    input.value="";
    closeMsgPopup();
}

function openEmojiPopup(){document.getElementById("emojiPopup").classList.add("show");}
function closeEmojiPopup(){document.getElementById("emojiPopup").classList.remove("show");}
function openGiftPopup(){renderGiftGrid();document.getElementById("giftPopup").classList.add("show");}
function closeGiftPopup(){document.getElementById("giftPopup").classList.remove("show");}

function triggerBulkAction(){
    showSpecialButton();
    sendChatMessage("আমি", `${selectedGift} এক ক্লিকে সব বোর্ডের মধ্যে পাঠানো হলো!`);
    const room=document.getElementById("roomPage");
    const seatEls=document.querySelectorAll(".seat.occupied .seat-avatar-wrap");
    const roomRect=room.getBoundingClientRect();
    const btnElem=document.querySelector(".sf-round-btn");
    const btnRect=btnElem.getBoundingClientRect();
    const startX=btnRect.left-roomRect.left+btnRect.width/2-18;
    const startY=btnRect.top-roomRect.top+btnRect.height/2-18;
    seatEls.forEach((seat,idx)=>{
        setTimeout(()=>{
            const rect=seat.getBoundingClientRect();
            const targetX=rect.left-roomRect.left+rect.width/2-18;
            const targetY=rect.top-roomRect.top+rect.height/2-18;
            const fly=document.createElement("div");
            fly.className="gift-fly";
            fly.textContent=selectedGift;
            fly.style.left=startX+"px";
            fly.style.top=startY+"px";
            fly.style.opacity="1";
            fly.style.transform="scale(1) rotate(0deg)";
            room.appendChild(fly);
            requestAnimationFrame(()=>{
                requestAnimationFrame(()=>{
                    fly.style.left=targetX+"px";
                    fly.style.top=targetY+"px";
                    fly.style.opacity="0.3";
                    fly.style.transform="scale(0.7) rotate(20deg)";
                });
            });
            setTimeout(()=>{if(fly.parentNode)fly.remove();},1400);
        },idx*50);
    });
    showToast(`${selectedGift} সব বোর্ডে পাঠানো হয়েছে!`);
}

function openGame(){
    const overlay=document.getElementById("gameOverlay");
    const frame=document.getElementById("gameFrame");
    frame.src="rocket-crash-game.html";
    overlay.classList.add("show");
    showToast("🎮 Rocket Crash গেম খোলা হচ্ছে...");
}

function closeGame(){
    const overlay=document.getElementById("gameOverlay");
    const frame=document.getElementById("gameFrame");
    overlay.classList.remove("show");
    frame.src="about:blank";
}

function showToast(msg){
    const t=document.getElementById("toast");
    t.textContent=msg;
    t.classList.add("show");
    setTimeout(()=>t.classList.remove("show"),1800);
}

init();
</script>
</body>
